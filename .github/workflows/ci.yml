name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: [prefer-lowest, prefer-stable]
        laravel: ['10.*', '11.*', '12.*', '13.*']
        php: ['8.2', '8.3', '8.4', '8.5']
        exclude:
          # Each Laravel release only supports some PHP versions.
          - { laravel: '10.*', php: '8.4' }
          - { laravel: '10.*', php: '8.5' }
          - { laravel: '11.*', php: '8.5' }
          - { laravel: '13.*', php: '8.2' }
        include:
          - laravel: '10.*'
            testbench: '8.*'
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.dependencies }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        # Laravel 10 and 11 are past security support, so Composer refuses them by
        # default; allowing them here only affects this test install.
        run: |
          composer config audit.block-insecure false
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update --dev
          composer update --${{ matrix.dependencies }} --no-interaction --no-progress

      - run: vendor/bin/pest

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if an API key was committed
        run: |
          if grep -rIEn 'fr_(live|test)_[A-Za-z0-9]' --exclude-dir=.git .; then
            echo "A Fewchurs API key must never be committed."
            exit 1
          fi
